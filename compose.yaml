services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-platform-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - type: bind
        source: ${BACKUP_HOST_PATH:-./database-backups}
        target: ${BACKUP_VOLUME_PATH:-/var/backups/erp}
        bind:
          create_host_path: true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: erp-platform-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - type: bind
        source: ${BACKUP_HOST_PATH:-./database-backups}
        target: ${BACKUP_VOLUME_PATH:-/var/backups/erp}
        bind:
          create_host_path: true
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: erp-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_platform
      POSTGRES_USER: erp_platform
      POSTGRES_PASSWORD: erp_platform_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_platform -d erp_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: erp-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  node:
    image: node:22-bookworm
    container_name: erp-platform-node
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"

volumes:
  postgres_data:
